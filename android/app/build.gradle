plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mian38.vditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.mian38.vditor"
        minSdk 24            // Android 7.0：覆盖绝大多数在用设备
        targetSdk 34
        versionCode 1200     // 1.2.0
        versionName "1.2.0"
        resourceConfigurations += ["zh-rCN", "en"]   // 只保留中英文资源，减小包体
    }

    // 发布版签名：keystore 放在项目外，避免密钥入库
    signingConfigs {
        release {
            def ks = System.getenv("VDITOR_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("VDITOR_STORE_PASS")
                keyAlias System.getenv("VDITOR_KEY_ALIAS")
                keyPassword System.getenv("VDITOR_KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            // 未提供签名时仍可产出 unsigned 包，便于 CI 或本地安装测试
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("VDITOR_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 允许在 XML 里直接写中文与使用较新的资源特性
        coreLibraryDesugaringEnabled false
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin', '**/*.version']
        }
    }

    lint {
        abortOnError false     // 不因 lint 警告中断构建
        checkReleaseBuilds false
    }

    buildFeatures {
        viewBinding true      // 生成布局绑定类，避免 findViewById 满天飞与空判
    }
}

// 依赖刻意精简：只用 AndroidX + Material + 协程，网络与 JSON 走系统自带
// （HttpURLConnection / org.json），不引入 OkHttp、Retrofit、Gson 等，
// 少一个库就少一份方法数与传递依赖，包体与混淆风险同时下降。
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
