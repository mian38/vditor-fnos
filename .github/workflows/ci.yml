name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明最低 Python 3.8，故以 3.8 作为矩阵下界实测；
        # 另加当前主流版本 3.12。
        python-version: ['3.8', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装（无第三方依赖，此步仅为确认环境）
        run: python -c "import sys; print(sys.version)"

      - name: 核心测试套件
        run: python tests/run_all.py

      - name: 前端性能路径检查
        run: node tools/perf_frontend_check.js

      - name: 扩展套件（大文件压力，较慢）
        run: python tests/run_all.py --all
