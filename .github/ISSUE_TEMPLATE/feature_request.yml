name: 功能建议
description: 提出新功能或改进意见
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到什么问题？现有方案为何不够用？
      placeholder: 我在多个设备间写同一份文档，希望……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 包括功能自带、第三方工具、脚本自动化等

  - type: dropdown
    id: scope
    attributes:
      label: 改动范围预估
      description: 帮助维护者评估成本
      options:
        - 仅前端（index.html / ui）
        - 仅后端（server.py / vd_util.py）
        - 前后端均涉及
        - 不确定
